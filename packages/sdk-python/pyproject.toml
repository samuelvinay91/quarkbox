[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quarkbox"
version = "0.1.0"
description = "QuarkBox Python SDK — High-performance cloud sandbox platform for AI agents & developers"
readme = "README.md"
authors = [{ name = "QuarkBox Team", email = "dev@quarkbox.dev" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]
keywords = ["quarkbox", "sandbox", "ai-agents", "cloud-development-environment", "code-execution", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/quarkbox/quarkbox"
Documentation = "https://docs.quarkbox.dev"
