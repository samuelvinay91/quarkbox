# Pipeline: Install → Lint → Typecheck → Audit → Build → E2E Tests
name: CI / Multi-Environment Execution Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-agent-execution:
    name: Run Native Agent Executions & Snapshot Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high || true

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Typecheck
        run: npm run build --workspaces --if-present

      - name: Build packages (API & SDK)
        run: npm run build

      - name: Start API Daemon
        env:
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_ACTOR: ${{ github.actor }}
          DEPLOY_PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_ENVIRONMENT: ci
          JWT_SECRET: ci-test-secret-do-not-use-in-production
        run: |
          nohup npm run start --workspace=packages/api > api.log 2>&1 &
          # Wait for the API to boot and become responsive on port 3000
          echo "Waiting for API server to be ready on port 3000..."
          timeout 30 bash -c 'until curl -s http://localhost:3000/api/docs > /dev/null; do sleep 2; done'
          echo "API is ready."

      - name: Run E2E Docker Live Container Test
        run: node examples/test-docker-agent.mjs
        
      - name: Run E2E Firecracker Architecture Test
        run: node examples/test-firecracker-agent.mjs

      - name: Upload API Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-logs
          path: api.log
