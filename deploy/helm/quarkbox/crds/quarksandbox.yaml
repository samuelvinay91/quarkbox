apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: quarksandboxes.quarkbox.dev
spec:
  group: quarkbox.dev
  names:
    kind: QuarkSandbox
    listKind: QuarkSandboxList
    plural: quarksandboxes
    singular: quarksandbox
    shortNames:
      - qsb
      - qbox
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image:
                  type: string
                  description: Container image for sandbox
                runtime:
                  type: string
                  enum: ["docker", "containerd", "firecracker"]
                  default: "docker"
                cpu:
                  type: integer
                  minimum: 1
                  maximum: 8
                  default: 1
                memory:
                  type: string
                  enum: ["128m", "256m", "512m", "1Gi", "2Gi", "4Gi", "8Gi"]
                  default: "512m"
                gitRepo:
                  type: string
                idleTimeoutSeconds:
                  type: integer
                  default: 1800
                env:
                  type: object
                  additionalProperties:
                    type: string
              required:
                - image
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Creating", "Running", "Paused", "Stopped", "Error"]
                podName:
                  type: string
                ipAddress:
                  type: string
                lastActiveAt:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: IP
          type: string
          jsonPath: .status.ipAddress
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
