apiVersion: v1
kind: Service
metadata:
  name: {{ include "quarkbox.fullname" . }}-api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "quarkbox.name" . }}-api
