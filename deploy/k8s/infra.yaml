apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkbox-postgres
  labels:
    app: quarkbox
    component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quarkbox
      component: postgres
  template:
    metadata:
      labels:
        app: quarkbox
        component: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: quarkbox
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quarkbox-secrets
                  key: database-password
            - name: POSTGRES_DB
              value: quarkbox
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - quarkbox
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - quarkbox
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: quarkbox-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: quarkbox-postgres
spec:
  selector:
    app: quarkbox
    component: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quarkbox-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkbox-redis
  labels:
    app: quarkbox
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quarkbox
      component: redis
  template:
    metadata:
      labels:
        app: quarkbox
        component: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: redis
          image: redis:7.4-alpine
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 6379
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quarkbox-secrets
                  key: redis-password
          livenessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - $(REDIS_PASSWORD)
                - ping
          readinessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - $(REDIS_PASSWORD)
                - ping
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: quarkbox-redis
spec:
  selector:
    app: quarkbox
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quarkbox-default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
