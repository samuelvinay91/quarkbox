apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkbox-api
  labels:
    app: quarkbox
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quarkbox
      component: api
  template:
    metadata:
      labels:
        app: quarkbox
        component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: quarkbox/api:0.1.0
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: quarkbox-secrets
                  key: database-host
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quarkbox-secrets
                  key: database-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: quarkbox-secrets
                  key: jwt-secret
            - name: REDIS_HOST
              value: quarkbox-redis
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: quarkbox-api
  labels:
    app: quarkbox
    component: api
spec:
  selector:
    app: quarkbox
    component: api
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
---
# Secrets must be managed externally (SealedSecrets, External Secrets Operator, or Vault). See docs/secrets.md
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quarkbox-api-policy
spec:
  podSelector:
    matchLabels:
      app: quarkbox
      component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: quarkbox
              component: ingress
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: quarkbox
              component: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: quarkbox
              component: redis
      ports:
        - protocol: TCP
          port: 6379

